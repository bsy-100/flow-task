<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Task Flow</h1>
    <form id="task-form" novalidate>
      <label for="title-input">할 일 제목</label>
      <div class="row">
        <input id="title-input" type="text" autocomplete="off" placeholder="할 일을 입력하세요">
        <button type="submit">등록</button>
      </div>
      <label for="description-input">설명 (선택, 2000자 이하)</label>
      <textarea id="description-input" rows="2"></textarea>
      <div class="row options">
        <div>
          <label for="priority-input">우선순위</label>
          <select id="priority-input">
            <option value="HIGH">높음</option>
            <option value="NORMAL" selected>보통</option>
            <option value="LOW">낮음</option>
          </select>
        </div>
        <div>
          <label for="due-date-input">마감일 (선택)</label>
          <input id="due-date-input" type="date">
        </div>
      </div>
      <p id="error-message" role="alert"></p>
    </form>
    <section id="filters" aria-label="검색과 필터">
      <input id="search-input" type="search" autocomplete="off" placeholder="제목 검색">
      <select id="status-filter" aria-label="상태 필터">
        <option value="">상태 전체</option>
        <option value="TODO">할 일</option>
        <option value="DOING">진행 중</option>
        <option value="DONE">완료</option>
      </select>
      <select id="priority-filter" aria-label="우선순위 필터">
        <option value="">우선순위 전체</option>
        <option value="HIGH">높음</option>
        <option value="NORMAL">보통</option>
        <option value="LOW">낮음</option>
      </select>
    </section>
    <ul id="task-list"></ul>
    <p id="empty-message">등록된 할 일이 없습니다.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
